name: Release

# Een tag `vX.Y.Z` bouwt het image (amd64 + arm64), zet het op GHCR met herkomstverklaring (SLSA
# provenance + SBOM + attestation) en maakt een GitHub Release met de installatiebestanden.
# De tag moet gelijk zijn aan `v` + de versie in pyproject.toml (en src/wisselweer/__init__.py).
#
# Actions staan op major-tags, zoals in ci.yml; Dependabot (github-actions, zie
# .github/dependabot.yml) stelt updates voor.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/roeltje/wisselweer # kleine letters verplicht

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # image naar ghcr.io
      id-token: write # attestation tekenen (OIDC)
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Tag controleren tegen de versie in het project
        run: |
          set -euo pipefail
          versie="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          pakket="$(python3 -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('src/wisselweer/__init__.py').read()).group(1))")"
          if [ "$GITHUB_REF_NAME" != "v$versie" ] || [ "$pakket" != "$versie" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, pyproject.toml ($versie) en __version__ ($pakket) horen gelijk te zijn (tag = v$versie)."
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags en labels bepalen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # 0.1.0, 0.1 en latest. De OCI-labels (o.a. source = deze repository) komen hieruit.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title=Wisselweer
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Bouwen en pushen
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Herkomstverklaring (attestation) naar GHCR
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # GitHub Release aanmaken
    steps:
      - uses: actions/checkout@v7

      - name: Installatiebestanden klaarzetten
        run: |
          set -euo pipefail
          versie="${GITHUB_REF_NAME#v}"
          mkdir release-assets
          # compose.yaml van de release wijst standaard naar het image van precies deze versie.
          sed -e 's|:${IMAGE_TAG:-latest}|:${IMAGE_TAG:-'"$versie"'}|g' compose.yaml > release-assets/compose.yaml
          if grep -q 'IMAGE_TAG:-latest' release-assets/compose.yaml \
            || [ "$(grep -c "ghcr.io/roeltje/wisselweer:\${IMAGE_TAG:-$versie}" release-assets/compose.yaml)" -ne 2 ]; then
            echo "::error::Image-tag in compose.yaml niet vastgezet op $versie"
            exit 1
          fi
          # GitHub hernoemt release-bestanden met een punt vooraan, vandaar `env.example`.
          cp .env.example release-assets/env.example
          cp deploy/docker-install.sh release-assets/docker-install.sh

      - name: GitHub Release maken
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          ## Installeren met Docker

          ```sh
          curl -fsSLO https://github.com/Roeltje/Wisselweer/releases/latest/download/docker-install.sh
          bash docker-install.sh
          ```

          Het image controleren (herkomstverklaring):

          ```sh
          gh attestation verify oci://ghcr.io/roeltje/wisselweer:__VERSIE__ --owner Roeltje
          ```

          Zie [docs/install-docker.md](https://github.com/Roeltje/Wisselweer/blob/main/docs/install-docker.md).
          ---
          EOF
          sed -i "s|__VERSIE__|${GITHUB_REF_NAME#v}|" notes.md
          gh release create "$GITHUB_REF_NAME" \
            release-assets/compose.yaml release-assets/env.example release-assets/docker-install.sh \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag
