name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"

      - name: Afhankelijkheden installeren
        run: uv sync --frozen --extra dev --python 3.12

      - name: Lint
        run: uv run ruff check .

      - name: Opmaak controleren
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q

      - name: Afhankelijkheden controleren op bekende kwetsbaarheden
        # Exporteert de vastgepinde productie-afhankelijkheden uit uv.lock (zonder het lockbestand
        # te wijzigen) en laat pip-audit falen bij bevindingen of niet-controleerbare pakketten.
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt > /tmp/req.txt
          uvx pip-audit -r /tmp/req.txt --strict
